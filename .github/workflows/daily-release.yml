name: 365 Daily Ritual Release

on:
  schedule:
    # 13:30 UTC = 19:00 IST (7:00 PM IST) every single day
    - cron: '30 13 * * *'
  workflow_dispatch:
    # Allows manual one-click release from GitHub Actions tab anytime

jobs:
  execute-release:
    name: Execute 7:00 PM IST Daily Release & Push Dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Daily Release & Push Notifications
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets not configured. Please add SUPABASE_URL (or EXPO_PUBLIC_SUPABASE_URL) and SUPABASE_ANON_KEY to Repository Secrets."
            exit 1
          fi
          node scripts/triggerRelease.js
